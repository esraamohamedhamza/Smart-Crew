[build]
  command = "bun install && bun run build"
  publish = ".output/public"

[build.environment]
  NITRO_PRESET = "netlify"

# القواعد دي بتجبر Netlify يوجه كل المسارات والصفحات لـ السيرفر بتاع Vinxi عشان يعرض الصفحات صح
[[redirects]]
  from = "/_server/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
